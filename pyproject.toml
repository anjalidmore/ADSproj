[project]
name = "co2ads"
version = "1.0.0"
description = "Global CO2 Emissions Analytics: an Applied Data Science course project"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "plotly>=5.22",
    "streamlit>=1.38",
    "matplotlib>=3.9",
    "pyarrow>=16",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/co2ads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
